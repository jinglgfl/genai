body { margin: 0; background: var(--page); color: var(--ink); font-family: Poppins, Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.55; }
body.has-banner { padding-bottom: 150px; }
a { color: var(--ink); }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; background: #fff; color: var(--ink); padding: 8px 14px; z-index: 100; }
.skip:focus { top: 12px; }

/* Top bar */
.bar { position: sticky; top: 0; z-index: 20; background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 28px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; font-size: 21px; white-space: nowrap; }
.brand img { display: block; height: 36px; width: auto; }
.bar-actions { display: flex; align-items: center; gap: 12px; }
.status { font-size: 13px; color: var(--bar-quiet); text-align: right; }
.btn-bar { background: transparent; color: var(--bar-ink); border: 1px solid var(--bar-ink); border-radius: 0; font: inherit; font-size: 13.5px; padding: 6px 16px; cursor: pointer; min-height: 36px; }
.btn-bar:hover { background: var(--bar-ink); color: var(--bar); }
.btn-bar.attention { background: var(--bar-ink); color: var(--bar); font-weight: 700; }
.btn-bar.attention:hover { background: #D6D6D6; }
.toolline { padding: 12px 28px; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--quiet); }
.toolline b { color: var(--ink); font-weight: 700; }

/* Start page */
.hero { background: var(--hero); color: #fff; text-align: center; padding: 64px 24px 56px; }
.hero h1 { font-size: 48px; font-weight: 700; line-height: 1.15; margin: 0 auto 14px; max-width: 900px; text-shadow: 0 0 22px rgba(255, 255, 255, .35); }
.hero h1:focus { outline: none; }
.hero p { font-size: 19px; max-width: 720px; margin: 0 auto 30px; }
.hero :focus-visible { outline-color: #fff; }
.hero-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; max-width: 780px; margin: 0 auto; }
.btn-hero { background: transparent; color: #fff; border: 1px solid #fff; border-radius: 0; font: inherit; font-size: 15px; padding: 12px 16px; min-height: 52px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.btn-hero:hover { background: #fff; color: var(--bar); }
.btn-hero.primary { background: #fff; color: var(--bar); font-weight: 700; }
.btn-hero.primary:hover { background: var(--band); }
.btn-note { display: block; font-size: 12.5px; font-weight: 400; opacity: .85; }
.intro { max-width: 1000px; margin: 0 auto; padding: 44px 28px 8px; }
.intro h2 { font-size: 32px; font-weight: 700; color: var(--head); margin: 0 0 18px; line-height: 1.2; }
.lead { font-size: 17px; margin: 0 0 40px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin: 0 0 40px; }
.steps h3 { font-size: 20px; font-weight: 700; color: var(--head); margin: 0 0 6px; }
.steps p { margin: 0; }
.browser-note { background: var(--band); border-left: 4px solid var(--ink); padding: 12px 16px; margin: 0 0 20px; }
.support-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 32px; }
.disclaimer { font-size: 14px; color: var(--quiet); border-left: 3px solid var(--rule); padding-left: 14px; margin: 28px 0 0; }

/* Form layout */
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto; padding: 28px; }
.content { min-width: 0; }
nav.sections { align-self: start; position: sticky; top: 88px; }
.overall { margin: 0 0 14px; font-size: 13.5px; }
.progress { height: 6px; background: var(--band); margin-top: 6px; }
.progress span { display: block; height: 100%; background: var(--red); }
nav.sections ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
nav.sections a { display: flex; justify-content: space-between; gap: 10px; border: 1px solid var(--line); padding: 8px 11px; font-size: 13.5px; line-height: 1.35; color: var(--ink); text-decoration: none; }
nav.sections a:hover { background: var(--band); }
nav.sections a[aria-current="page"] { background: var(--bar); color: var(--bar-ink); border-color: var(--bar); }
nav.sections .count { color: var(--quiet); white-space: nowrap; }
nav.sections a[aria-current="page"] .count { color: #CFCFCF; }
nav.sections li.group { font-size: 13.5px; font-weight: 700; padding: 4px 0 0; margin-bottom: -3px; }
nav.sections li.sub-item a { margin-left: 14px; }
.mobile-nav { display: none; margin: 0 0 20px; }
.kicker { font-size: 14px; font-weight: 700; color: var(--quiet); margin: 0 0 6px; }
.section-title { font-size: 34px; font-weight: 700; color: var(--head); margin: 0; line-height: 1.2; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 16px; }
.section-title:focus { outline: none; }
.section-title small { font-size: 14px; font-weight: 400; color: var(--quiet); }
hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 20px 0 24px; }
.flash { background: var(--band); border-left: 4px solid var(--ink); padding: 12px 16px; margin: 0 0 22px; }
h2.sub { font-size: 24px; font-weight: 700; color: var(--head); margin: 36px 0 12px; line-height: 1.25; }
.section-intro { margin: -8px 0 26px; font-size: 15px; }
.section-intro p { margin: 0 0 10px; }
.na-offer { background: var(--band); padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.ref { margin: 0 0 16px; font-size: 13.5px; }

/* Fields */
.field { margin: 0 0 16px; min-width: 0; }
.field-label { display: block; font-size: 13.5px; font-weight: 700; margin: 0 0 5px; padding: 0; }
.optional { font-weight: 400; color: var(--quiet); }
.hint { font-size: 13px; color: var(--quiet); margin: -2px 0 6px; }
.error { color: #B3141A; font-weight: 700; font-size: 14px; margin: 6px 0 0; }
input[type="text"], input[type="date"], textarea, select {
  font: inherit; font-size: 15px; color: var(--ink); background: #fff; width: 100%;
  border: 1px solid var(--field); border-radius: 0; padding: 9px 11px; min-height: 44px; }
input[aria-invalid="true"] { border: 2px solid #B3141A; }
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
::placeholder { color: #8C8C8C; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }
.details-grid .wide { grid-column: 1 / -1; }
.checks { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; font-size: 15px; line-height: 1.4; }
.check:hover { background: var(--band); }
.check input { flex: none; width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--bar); cursor: pointer; }
.check .quiet { color: var(--quiet); }
.other-field { margin: 10px 0 0 32px; }

/* Standards */
.q { padding: 0 0 26px; margin: 0 0 30px; border-bottom: 1px solid var(--rule); scroll-margin-top: 90px; }
.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 6px; }
.badge { font-size: 11.5px; font-weight: 700; padding: 1px 8px; background: var(--bar); color: var(--bar-ink); }
.badge.warn { background: var(--yellow); color: var(--ink); }
.q-text { font-size: 22px; font-weight: 700; color: var(--head); line-height: 1.35; margin: 0 0 8px; }
.criteria { margin: 0 0 8px; padding-left: 22px; }
.criteria li { margin: 0 0 3px; }
.qfields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
.resp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.resp.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { position: relative; display: block; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.opt span { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; height: 100%; padding: 8px 6px; border: 1px solid var(--line); text-align: center; font-size: 14px; line-height: 1.25; cursor: pointer; background: #fff; }
.opt span:hover { background: var(--band); }
.opt input:checked + span { background: var(--bar); color: var(--bar-ink); border-color: var(--bar); font-weight: 700; }
.opt input:checked + span::before { content: "\2713"; }
.opt input:focus-visible + span { outline: 3px solid var(--red); outline-offset: 2px; }
.clear-row { min-height: 30px; display: flex; justify-content: flex-end; align-items: center; margin: 4px 0 0; }
details.panel { background: var(--band); margin: 0 0 8px; }
details.panel summary { cursor: pointer; padding: 10px 14px; font-size: 14.5px; }
.panel-body { padding: 0 14px 14px; font-size: 14.5px; }

/* Risk matrix and log */
.table-wrap { overflow-x: auto; margin: 0 0 18px; }
table.matrix { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13.5px; }
table.matrix caption { text-align: left; font-weight: 700; margin: 0 0 6px; }
table.matrix th, table.matrix td { border: 2px solid #fff; padding: 8px 6px; text-align: center; }
table.matrix thead th { background: var(--bar); color: var(--bar-ink); font-weight: 700; }
table.matrix tbody th { background: var(--band); text-align: left; font-weight: 700; white-space: nowrap; }
.band-low { background: var(--low); }
.band-medium { background: var(--medium); }
.band-high { background: var(--high); }
.band-critical { background: var(--critical); }
.example { background: #fff; border: 1px solid var(--rule); padding: 12px 14px; margin: 0 0 10px; }
.example h3 { font-size: 16px; margin: 0 0 4px; }
.example p { margin: 0; }
.example dl { display: grid; grid-template-columns: minmax(120px, 210px) minmax(0, 1fr); gap: 6px 14px; margin: 10px 0 0; }
.example dt { font-weight: 700; }
.example dd { margin: 0; }
.example dd ul { margin: 0; padding-left: 18px; }
.risk { border: 1px solid var(--line); padding: 16px 18px 4px; margin: 0 0 18px; }
.risk-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 10px; }
.risk-head h3 { font-size: 20px; font-weight: 700; color: var(--head); margin: 0; }
.rating-picker { margin: 0 0 16px; }
.rating-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(170px, auto); column-gap: 16px; align-items: end; }
.rating-row .field { margin: 0; }
.rating-label { font-size: 13px; color: var(--quiet); display: block; margin: 0 0 4px; }
.rating { display: flex; align-items: center; min-height: 44px; padding: 8px 12px; font-weight: 700; }
.rating.none { font-weight: 400; color: var(--quiet); border: 1px dashed var(--field); }
.add-row { margin: 0 0 8px; }

/* Sign-off */
.approval { border: 1px solid var(--line); padding: 18px 18px 4px; margin: 24px 0 0; }
.sig-note { margin: 0; min-height: 44px; display: flex; align-items: center; color: var(--quiet); font-size: 14.5px; border-bottom: 1px solid var(--field); }
.plain-list { list-style: none; margin: 0; padding: 0; }
.plain-list li { padding: 6px 0; border-bottom: 1px solid var(--rule); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 14.5px; line-height: 1.3; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 0; padding: 9px 22px; min-height: 44px; cursor: pointer; text-decoration: none; text-align: center; }
.btn:hover { background: var(--band); }
.btn.primary { background: var(--bar); color: var(--bar-ink); border-color: var(--bar); }
.btn.primary:hover { background: #333; }
.btn.small { font-size: 13px; padding: 5px 14px; min-height: 34px; }
.btn-link { background: none; border: 0; padding: 0; font: inherit; font-size: 13.5px; color: var(--ink); text-decoration: underline; cursor: pointer; }
.nextback { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.keep-actions { display: flex; flex-wrap: wrap; gap: 12px; }

/* Footer */
.site-footer { margin-top: 48px; border-top: 1px solid var(--rule); padding: 18px 28px 26px; }
.pilot { max-width: 1240px; margin: 0 auto 12px; font-size: 14px; }
.pilot mark { background: var(--yellow); color: var(--ink); font-weight: 700; padding: 0 3px; margin-right: 8px; }
.foot-copy, .foot-meta { text-align: center; font-size: 12.5px; color: var(--quiet); margin: 0; }
.foot-copy { margin-bottom: 6px; }
.foot-meta a, .foot-meta .btn-link { color: var(--quiet); font-size: 12.5px; }

/* Cookie banner */
.cookie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bar); color: var(--bar-ink); padding: 16px 28px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; box-shadow: 0 -2px 14px rgba(0, 0, 0, .25); }
.cookie p { margin: 0; font-size: 14px; max-width: 780px; }
.cookie a { color: var(--bar-ink); }
.cookie-btns { display: flex; gap: 10px; }
.cookie .btn-bar { min-width: 120px; font-size: 14.5px; padding: 9px 16px; }

/* Dialog */
dialog { border: 1px solid var(--ink); border-radius: 0; padding: 24px 26px; max-width: 520px; width: calc(100% - 32px); color: var(--ink); font: inherit; }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
dialog h2 { font-size: 22px; color: var(--head); margin: 0 0 10px; line-height: 1.25; }
dialog p { margin: 0; white-space: pre-line; }
.dlg-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

/* Printed form: hidden on screen */
#report { display: none; }

@media (max-width: 900px) {
  .steps { grid-template-columns: 1fr; gap: 18px; }
  .qfields { grid-template-columns: minmax(0, 1fr); }
  .rating-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .rating-row .rating-result { grid-column: 1 / -1; margin-top: 10px; }
}
@media (max-width: 767px) {
  .bar { padding: 10px 16px; min-height: 56px; }
  .brand { font-size: 16px; gap: 10px; }
  .brand img { height: 28px; }
  .status { display: none; }
  .btn-bar { padding: 5px 10px; }
  .toolline { padding: 10px 16px; }
  .hero { padding: 40px 16px 36px; }
  .hero h1 { font-size: 32px; }
  .hero p { font-size: 16px; }
  .intro { padding: 32px 16px 8px; }
  .intro h2 { font-size: 26px; }
  .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 0; }
  nav.sections { display: none; }
  .mobile-nav { display: block; }
  .section-title { font-size: 26px; }
  .details-grid { grid-template-columns: minmax(0, 1fr); }
  .resp { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .resp.two { grid-template-columns: minmax(0, 1fr); }
  .q-text { font-size: 19px; }
  .rating-row { grid-template-columns: minmax(0, 1fr); row-gap: 10px; }
  .rating-row .rating-result { margin-top: 0; }
  .example dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .example dd { margin-bottom: 6px; }
  .other-field { margin-left: 0; }
  .site-footer { padding: 18px 16px 24px; }
  .cookie { padding: 14px 16px; }
  .cookie-btns { width: 100%; }
  .cookie .btn-bar { flex: 1 1 0; }
  body.has-banner { padding-bottom: 230px; }
}
@media (max-width: 420px) {
  .brand-title { white-space: normal; line-height: 1.2; }
}

@media print {
  @page { size: A4; margin: 14mm 12mm; }
  body { font-size: 9.5pt; color: #000; background: #fff; padding: 0 !important; }
  body > *:not(#report) { display: none !important; }
  #report { display: block; }
  #report h1 { font-size: 20pt; margin: 0; line-height: 1.2; }
  #report h2 { font-size: 14pt; margin: 14pt 0 6pt; }
  #report h3 { font-size: 11.5pt; margin: 12pt 0 5pt; }
  #report p { margin: 0 0 5pt; }
  .r-head { display: flex; align-items: center; gap: 14pt; border-bottom: 1.5pt solid #000; padding-bottom: 10pt; margin-bottom: 10pt; }
  .r-logo { height: 34pt; width: auto; }
  .r-kicker { margin: 0 !important; font-size: 10pt; color: #444; }
  .r-intro { font-size: 8.5pt; color: #333; }
  .r-details { border-collapse: collapse; width: 100%; margin-bottom: 6pt; }
  .r-details th { text-align: left; font-weight: 700; width: 30%; padding: 4pt 8pt 4pt 0; vertical-align: top; border-bottom: .5pt solid #bbb; }
  .r-details td { padding: 4pt 0; border-bottom: .5pt solid #bbb; vertical-align: top; }
  .r-details td div { margin: 0 0 1pt; }
  table.r-grid { border-collapse: collapse; width: 100%; font-size: 8.5pt; margin: 0 0 8pt; }
  .r-grid th, .r-grid td { border: .5pt solid #777; padding: 4pt 5pt; vertical-align: top; text-align: left; }
  .r-grid thead th { background: #e8e8e8; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .r-grid tr { break-inside: avoid; }
  .r-grid ul { margin: 2pt 0 0; padding-left: 11pt; }
  .r-grid td p { margin: 0 0 3pt; }
  .r-check th:nth-child(1) { width: 31%; } .r-check th:nth-child(2), .r-check th:nth-child(3) { width: 27%; }
  .r-risks th:nth-child(1) { width: 24%; } .r-risks th:nth-child(2), .r-risks th:nth-child(4) { width: 12%; } .r-risks th:nth-child(5) { width: 14%; }
  table.r-narrow { width: auto; min-width: 70%; }
  .r-prompt { color: #555; font-style: italic; font-size: 8pt; }
  .r-pupil { font-weight: 700; font-size: 7.5pt; }
  .r-qtext { font-weight: 700; }
  .r-status { white-space: nowrap; }
  .r-note { white-space: pre-wrap; }
  .table-wrap { overflow: visible; margin-bottom: 8pt; }
  table.matrix { min-width: 0; font-size: 8.5pt; }
  table.matrix th, table.matrix td { border: .5pt solid #777; padding: 3pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table.matrix thead th { background: #e8e8e8; color: #000; }
  .r-approval { border: .75pt solid #000; padding: 8pt 10pt; margin-top: 10pt; break-inside: avoid; }
  .r-line { margin: 0 0 7pt !important; }
  .r-blank { display: inline-block; min-width: 75mm; border-bottom: .75pt solid #000; height: 12pt; vertical-align: bottom; }
  .r-section { break-before: page; }
  .r-removed { border-bottom: .5pt solid #999; padding: 5pt 0; break-inside: avoid; }
  .r-disclaimer { margin-top: 16pt; font-size: 8.5pt; color: #333; border-top: .5pt solid #999; padding-top: 6pt; break-inside: avoid; }
  a { color: #000; text-decoration: none; }
}
</style>

<script>
(function () {
  'use strict';

  const SETTINGS = window.CHECKER_SETTINGS || {};
  const FORM = window.CHECKER_FORM || {};
  const FILE_TYPE = 'lgfl-genai-tool-qa';
  const FORMAT_VERSION = 1;
  const STORE_KEY = 'lgfl-genai-qa.assessment';
  const CONSENT_KEY = 'lgfl-genai-qa.analytics-consent';
  const MAX_FILE_BYTES = 1024 * 1024;
  const DEBUG = /[?&]debug(=|&|$)/.test(location.search);
  const GA_ID = String(SETTINGS.gaMeasurementId || '').trim();
  const FORM_VERSION = String(FORM.version || '');
  const APP_NAME = String(FORM.title || 'Gen AI Tool Quality Assurance');
  const DFE_URL = (safeUrl(FORM.dfeUrl) || '').split('#')[0];
  const SUPPORT_URL = safeUrl(SETTINGS.supportUrl);
  const SUPPORT_EMAIL = String(SETTINGS.supportEmail || '').trim();
  const SUPPORT_MAILTO = SUPPORT_EMAIL ? 'mailto:' + SUPPORT_EMAIL + '?subject=' + encodeURIComponent(APP_NAME + ': support') : null;
  const PAGE_NAME = 'Gen AI Tool Quality Assurance | LGfL';

  const STATUSES = [
    { value: 'met', label: 'Met', key: 'met' },
    { value: 'part', label: 'Part', key: 'part' },
    { value: 'not_met', label: 'Not Met', key: 'not_met' },
    { value: 'na', label: 'N/A', key: 'not_applicable' },
  ];
  const STATUS_LABEL = Object.fromEntries(STATUSES.map(x => [x.value, x.label]));
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  const T = FORM.labels || {};
  const SECTIONS = FORM.sections || {};
  const AREAS = Array.isArray(FORM.areas) ? FORM.areas.filter(a => a && typeof a === 'object' && Array.isArray(a.standards)) : [];
  const ALL_STANDARDS = AREAS.flatMap(a => a.standards.filter(s => s && typeof s === 'object'));
  const STANDARD_BY_ID = new Map();
  ALL_STANDARDS.forEach(s => { if (s.id && !STANDARD_BY_ID.has(s.id)) STANDARD_BY_ID.set(s.id, s); });
  const areaOf = std => AREAS.find(a => a.standards.includes(std));
  const USE_CASES = Array.isArray(FORM.useCases) ? FORM.useCases : [];
  const RISK = FORM.riskMatrix || {};
  const REVIEWERS = Array.isArray(FORM.reviewers) ? FORM.reviewers : [];
  const REGISTERS = Array.isArray(FORM.registers) ? FORM.registers : [];
  const DECISIONS = Array.isArray(FORM.decisions) ? FORM.decisions : [];
  const DECISION_LABEL = Object.fromEntries(DECISIONS.map(d => [d.id, d.label]));
  const PLACEHOLDERS = FORM.riskPlaceholders || {};

  // The pages of the form, in order.
  const areaHash = a => 'area-' + String(a.id).toLowerCase();
  const PAGES = [{ hash: 'profile', kind: 'profile', section: 'profile' }]
    .concat(AREAS.map(a => ({ hash: areaHash(a), kind: 'area', area: a })))
    .concat([{ hash: 'risks', kind: 'risks', section: 'risks' }, { hash: 'signoff', kind: 'signoff', section: 'signoff' }]);
  const navLabel = p => (p.area ? p.area.nav : SECTIONS[p.section].nav);
  const pageTitle = p => (p.area ? p.area.title : SECTIONS[p.section].title);

  const $ = sel => document.querySelector(sel);
  const fileInput = $('#file-input');
  const LOGO_SRC = $('#logo').src;

  // Builds elements. Text always goes in as text nodes, never as HTML.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'value') el.value = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false || kid === '') continue;
      el.append(kid instanceof Node ? kid : String(kid));
    }
    return el;
  }

  function checkForm() {
    const problems = [];
    if (!FORM_VERSION) problems.push('The form has no version.');
    ['profile', 'checklist', 'risks', 'signoff'].forEach(k => {
      if (!SECTIONS[k] || !SECTIONS[k].title || !SECTIONS[k].nav) problems.push('sections.' + k + ' needs a title and a nav label.');
    });
    if (!AREAS.length) problems.push('There are no checklist areas.');
    const areaIds = new Set();
    AREAS.forEach((a, i) => {
      if (!/^[A-Za-z0-9]+$/.test(String(a.id || '')) || areaIds.has(a.id)) problems.push('Area ' + (i + 1) + ' needs its own id made of letters or numbers.');
      areaIds.add(a.id);
      if (!a.title || !a.nav) problems.push('Area ' + (a.id || i + 1) + ' needs a title and a nav label.');
      if (!a.standards.length) problems.push('Area ' + (a.id || i + 1) + ' has no standards.');
    });
    const seen = new Set();
    ALL_STANDARDS.forEach((s, i) => {
      const where = 'Standard ' + (s.id || i + 1);
      ['id', 'title'].forEach(f => {
        if (typeof s[f] !== 'string' || !s[f].trim()) problems.push(where + ' has no ' + f + '.');
      });
      ['supplier', 'school'].forEach(f => {
        if (!plainText(s[f]).trim()) problems.push(where + ' has no ' + f + '.');
      });
      if (!Array.isArray(s.criteria)) problems.push(where + ' has no criteria list.');
      if (s.id) {
        if (seen.has(s.id)) problems.push(where + ': the id is used more than once.');
        seen.add(s.id);
      }
    });
    const five = v => Array.isArray(v) && v.length === 5;
    if (!five(RISK.likelihood) || !five(RISK.impact) || !five(RISK.bands) || RISK.bands.some(r => !five(r))) {
      problems.push('The risk matrix needs 5 likelihood levels, 5 impact levels and a 5 by 5 table of bands.');
    }
    if (!DECISIONS.length) problems.push('There are no decisions to choose from.');
    return problems;
  }

  // ---------- Small helpers ----------
  const pad = n => String(n).padStart(2, '0');
  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  function fmtDate(ymd) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || '');
    return m && MONTHS[+m[2] - 1] ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : '';
  }
  function fmtDateTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  // The tool name as it can appear in a file name on Windows, Mac and ChromeOS.
  const fileSafe = s => String(s).replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^\.+|\.+$/g, '').slice(0, 60).trim() || 'tool';
  function safeUrl(u) {
    try {
      const url = new URL(String(u || '').trim());
      return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : null;
    } catch (e) { return null; }
  }
  function joinList(parts) {
    return parts.length < 2 ? parts.join('') : parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
  }
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  function disclaimer(tool) {
    return 'This form records your school’s own review of ' + (tool ? tool : 'a tool') +
      '. It is not an LGfL approval, endorsement or certification of the tool or its supplier.';
  }
  const extLink = (url, text) => h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, text, h('span', { class: 'sr-only' }, ' (opens in a new tab)'));
  // Text made of plain strings and { text, url } links.
  function richText(segs) {
    return (Array.isArray(segs) ? segs : [segs]).map(s => {
      if (typeof s === 'string') return s;
      const u = s && safeUrl(s.url);
      return u ? extLink(u, s.text) : (s && s.text) || '';
    });
  }
  const plainText = segs => (Array.isArray(segs) ? segs : [segs]).map(s => (typeof s === 'string' ? s : (s && s.text) || '')).join('');
  function dfeRef(anchor) {
    if (!DFE_URL || !anchor) return null;
    const name = anchor.charAt(0).toUpperCase() + anchor.slice(1).replace(/-/g, ' ');
    return h('p', { class: 'ref' }, extLink(DFE_URL + '#' + anchor, 'DfE standards: ' + name + ' ↗'));
  }
  const box = on => (on ? '☒' : '☐');
  const ratingBand = (l, i) => (l && i ? RISK.bands[l - 1][i - 1] : '');
  const ratingText = (l, i) => (l && i ? ratingBand(l, i) + ' (Score: ' + l * i + ')' : '');

  const store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };

  // ---------- Assessment state ----------
  let state = null;
  let storageOk = true;
  let saveTimer = null;
  let firstRender = true;
  let pendingFocus = null;
  let flash = null;

  function newRisk() {
    return { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), hazard: '', inherentL: 0, inherentI: 0, mitigation: '', residualL: 0, residualI: 0, owner: '' };
  }

  function newState() {
    const now = new Date().toISOString();
    return {
      fileType: FILE_TYPE, formatVersion: FORMAT_VERSION,
      formVersion: FORM_VERSION, standardIds: ALL_STANDARDS.map(s => s.id),
      created: now, updated: now, downloaded: null,
      profile: { tool: '', assessedBy: '', date: todayISO(), demographic: '', useCases: [], otherUse: '' },
      standards: {},
      risks: [newRisk()],
      signoff: { reviewers: [], registers: [], approver: '', date: '', decision: '', whoCanUse: '', reviewDate: '' },
      newIds: [],
      analytics: { completeSent: false, areasSent: [] },
      lastView: 'profile',
    };
  }

  const answerHasContent = a => !!(a && (a.status || a.supplier || a.school));
  const riskHasContent = r => !!(r.hazard.trim() || r.mitigation.trim() || r.owner.trim() || r.inherentL || r.inherentI || r.residualL || r.residualI);
  function removedAnswers(s) {
    return Object.keys(s.standards)
      .filter(id => !STANDARD_BY_ID.has(id) && answerHasContent(s.standards[id]))
      .map(id => Object.assign({ id }, s.standards[id]));
  }

  // Turns saved data (from this browser or a file) into a clean state, checking every field.
  function migrate(d) {
    if (!d || typeof d !== 'object' || d.fileType !== FILE_TYPE) return null;
    if (!d.profile || typeof d.profile !== 'object' || !d.standards || typeof d.standards !== 'object' || Array.isArray(d.standards)) return null;
    const str = v => (typeof v === 'string' ? v.slice(0, 20000) : '');
    const ymd = v => (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '');
    const rating = v => (Number.isInteger(v) && v >= 1 && v <= 5 ? v : 0);
    const pick = (v, allowed) => (Array.isArray(v) ? Array.from(new Set(v.filter(x => allowed.has(x)))) : []);
    const s = newState();
    const p = d.profile;
    s.profile = {
      tool: str(p.tool), assessedBy: str(p.assessedBy), date: ymd(p.date), demographic: str(p.demographic),
      useCases: pick(p.useCases, new Set(USE_CASES.map(u => u.id))), otherUse: str(p.otherUse),
    };
    const valid = new Set(STATUSES.map(x => x.value));
    Object.keys(d.standards).slice(0, 500).forEach(id => {
      const a = d.standards[id];
      if (!a || typeof a !== 'object' || id.length > 100) return;
      s.standards[id] = { status: valid.has(a.status) ? a.status : '', supplier: str(a.supplier), school: str(a.school), title: str(a.title) };
    });
    const riskIds = new Set();
    s.risks = (Array.isArray(d.risks) ? d.risks : []).slice(0, 200).filter(r => r && typeof r === 'object').map(r => {
      let id = str(r.id);
      if (!/^[a-z0-9]{1,40}$/i.test(id) || riskIds.has(id)) id = newRisk().id;
      riskIds.add(id);
      return {
        id, hazard: str(r.hazard), inherentL: rating(r.inherentL), inherentI: rating(r.inherentI),
        mitigation: str(r.mitigation), residualL: rating(r.residualL), residualI: rating(r.residualI), owner: str(r.owner),
      };
    });
    if (!s.risks.length) s.risks = [newRisk()];
    const so = d.signoff && typeof d.signoff === 'object' ? d.signoff : {};
    s.signoff = {
      reviewers: pick(so.reviewers, new Set(REVIEWERS.map(r => r.id))),
      registers: pick(so.registers, new Set(REGISTERS.map(r => r.id))),
      approver: str(so.approver), date: ymd(so.date), decision: DECISION_LABEL[so.decision] ? so.decision : '',
      whoCanUse: str(so.whoCanUse), reviewDate: ymd(so.reviewDate),
    };
    s.created = str(d.created) || s.created;
    s.updated = str(d.updated) || s.updated;
    s.downloaded = str(d.downloaded) || null;
    const sameForm = str(d.formVersion) === FORM_VERSION;
    const oldNew = Array.isArray(d.newIds) ? d.newIds.filter(x => typeof x === 'string' && STANDARD_BY_ID.has(x)) : [];
    if (sameForm) {
      s.newIds = oldNew;
    } else {
      const oldIds = Array.isArray(d.standardIds) ? new Set(d.standardIds) : null;
      const added = ALL_STANDARDS.filter(x => (oldIds ? !oldIds.has(x.id) : !s.standards[x.id])).map(x => x.id);
      s.newIds = Array.from(new Set(oldNew.concat(added)));
    }
    const an = d.analytics && typeof d.analytics === 'object' ? d.analytics : {};
    s.analytics.completeSent = an.completeSent === true;
    s.analytics.areasSent = Array.isArray(an.areasSent) ? an.areasSent.filter(x => typeof x === 'string') : [];
    s.lastView = str(d.lastView) || 'profile';
    // Only report changes when the form version differs, so the message shows once.
    const notes = sameForm ? { added: 0, removed: 0 } : { added: s.newIds.length, removed: removedAnswers(s).length };
    return { state: s, notes };
  }

  function loadSaved() {
    const raw = store.get(STORE_KEY);
    if (!raw) return null;
    try { return migrate(JSON.parse(raw)); } catch (e) { return null; }
  }

  function changeText(n) {
    const parts = [];
    if (n.added) parts.push(plural(n.added, 'standard is new', 'standards are new'));
    if (n.removed) parts.push(plural(n.removed, 'answer is for a standard', 'answers are for standards') + ' no longer in the checklist (kept in the file and printed at the end of the form)');
    return parts.length ? 'The form has changed since this was saved: ' + joinList(parts) + '.' : '';
  }

  const hasTool = s => !!(s && s.profile.tool.trim());
  const hasWork = s => !!(s && (hasTool(s) || Object.keys(s.standards).length || s.risks.some(riskHasContent)));
  const notDownloaded = s => hasWork(s) && (!s.downloaded || s.downloaded < s.updated);

  const statusOf = id => (state && state.standards[id] && state.standards[id].status) || '';
  const doneIn = a => a.standards.filter(s => statusOf(s.id)).length;
  const doneCount = () => ALL_STANDARDS.filter(s => statusOf(s.id)).length;
  const areaCount = a => doneIn(a) + ' of ' + a.standards.length + ' with a status';
  const loggedRisks = () => state.risks.filter(r => r.hazard.trim());
  function statusCounts() {
    const c = {};
    STATUSES.forEach(x => { c[x.value] = 0; });
    let none = 0;
    ALL_STANDARDS.forEach(s => { const v = statusOf(s.id); if (v) c[v]++; else none++; });
    return { c, none };
  }

  function touch() {
    state.updated = new Date().toISOString();
    scheduleSave();
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 300);
  }
  function persist() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!state) return;
    state.formVersion = FORM_VERSION;
    state.standardIds = ALL_STANDARDS.map(s => s.id);
    if (hasTool(state)) storageOk = store.set(STORE_KEY, JSON.stringify(state));
    renderStatus();
  }

  // ---------- Analytics (Google Analytics 4, only after consent) ----------
  let gaLoaded = false;
  const consent = () => store.get(CONSENT_KEY);

  function loadGA() {
    if (!GA_ID) return;
    window['ga-disable-' + GA_ID] = false;
    if (gaLoaded) return;
    gaLoaded = true;
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    window.gtag('js', new Date());
    window.gtag('config', GA_ID, { allow_google_signals: false, allow_ad_personalization_signals: false });
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA_ID);
    document.head.append(s);
  }

  function disableGA() {
    if (!GA_ID) return;
    window['ga-disable-' + GA_ID] = true;
    const names = document.cookie.split(';').map(c => c.trim().split('=')[0]).filter(n => /^_ga(_|$)/.test(n));
    const parts = location.hostname.split('.');
    const domains = [''];
    for (let i = 0; i < parts.length - 1; i++) domains.push('.' + parts.slice(i).join('.'));
    names.forEach(n => domains.forEach(dm => {
      document.cookie = n + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/' + (dm ? '; domain=' + dm : '');
    }));
  }

  // Never pass anything a school typed into track().
  function track(name, params) {
    const sending = !!(GA_ID && consent() === 'granted' && window.gtag);
    if (DEBUG) console.info('[analytics]', name, params || {}, sending ? 'sent' : 'not sent');
    if (sending) window.gtag('event', name, params || {});
  }

  function checkCompletion() {
    AREAS.forEach(a => {
      if (doneIn(a) === a.standards.length && !state.analytics.areasSent.includes(a.id)) {
        state.analytics.areasSent.push(a.id);
        track('section_complete', { section: a.id });
      }
    });
  }

  // A recorded decision is the finish line.
  function recordDecision() {
    if (state.analytics.completeSent || !state.signoff.decision) return;
    state.analytics.completeSent = true;
    const { c, none } = statusCounts();
    const params = { form_version: FORM_VERSION, decision: state.signoff.decision, risks_logged: loggedRisks().length, not_answered: none };
    STATUSES.forEach(x => { params[x.key] = c[x.value]; });
    track('assessment_complete', params);
  }

  function showBanner() {
    $('#cookie-banner').hidden = false;
    document.body.classList.add('has-banner');
  }
  function hideBanner() {
    $('#cookie-banner').hidden = true;
    document.body.classList.remove('has-banner');
  }
  function setConsent(value) {
    store.set(CONSENT_KEY, value);
    if (value === 'granted') loadGA(); else disableGA();
    hideBanner();
  }
  function buildBanner() {
    const privacy = safeUrl(SETTINGS.privacyNoticeUrl);
    $('#cookie-banner').append(
      h('p', null,
        'Can we use Google Analytics cookies to count how many people use this form and finish an assessment? Google never receives what you type into the form.',
        privacy ? [' ', h('a', { href: privacy, target: '_blank', rel: 'noopener noreferrer' }, 'Privacy notice')] : null),
      h('div', { class: 'cookie-btns' },
        h('button', { type: 'button', class: 'btn-bar', onclick: () => setConsent('granted') }, 'Accept'),
        h('button', { type: 'button', class: 'btn-bar', onclick: () => setConsent('denied') }, 'Reject')));
  }

  // ---------- Dialog ----------
  function ask(opts) {
    const title = opts.title, body = opts.body || '', okLabel = opts.ok || 'OK', cancelLabel = opts.cancel === undefined ? 'Cancel' : opts.cancel;
    const dlg = $('#dlg');
    if (!dlg || typeof dlg.showModal !== 'function') {
      if (cancelLabel) return Promise.resolve(window.confirm(title + '\n\n' + body));
      window.alert(title + '\n\n' + body);
      return Promise.resolve(true);
    }
    $('#dlg-title').textContent = title;
    $('#dlg-body').textContent = body;
    const okBtn = $('#dlg-ok'), cancelBtn = $('#dlg-cancel');
    okBtn.textContent = okLabel;
    cancelBtn.textContent = cancelLabel || '';
    cancelBtn.hidden = !cancelLabel;
    return new Promise(resolve => {
      const done = v => {
        okBtn.onclick = null; cancelBtn.onclick = null; dlg.oncancel = null;
        dlg.close();
        resolve(v);
      };
      okBtn.onclick = () => done(true);
      cancelBtn.onclick = () => done(false);
      dlg.oncancel = e => { e.preventDefault(); done(!cancelLabel); };
      dlg.showModal();
      (cancelLabel ? cancelBtn : okBtn).focus();
    });
  }

  // ---------- Starting, saving and loading ----------
  async function startNew() {
    const existing = hasTool(state) ? state : (loadSaved() || {}).state;
    if (existing && notDownloaded(existing)) {
      const ok = await ask({
        title: 'Start a new assessment?',
        body: 'You haven’t saved a copy of the assessment of ' + (existing.profile.tool || 'your tool') + ' since your last change. If you start a new one, it will be replaced in this browser as soon as you name the new tool.',
        ok: 'Start new', cancel: 'Keep it',
      });
      if (!ok) return;
    }
    state = newState();
    track('assessment_start', { method: 'new' });
    go('profile');
  }

  function carryOn() {
    if (!hasTool(state)) {
      const saved = loadSaved();
      if (!saved) { render(); return; }
      state = saved.state;
      flash = changeText(saved.notes) || null;
      track('assessment_start', { method: 'carry_on' });
      persist();
    }
    go(validHash(state.lastView) || 'profile');
  }

  function chooseFile() {
    fileInput.value = '';
    fileInput.click();
  }

  async function loadError(reason, message) {
    track('file_load_error', { reason });
    await ask({ title: 'Couldn’t load that file', body: message, cancel: null });
  }

  async function onFileChosen() {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    if (f.size > MAX_FILE_BYTES) return loadError('too_big', 'That file is over 1 MB, which is too big to be a saved copy from this form.');
    let data;
    try { data = JSON.parse(await f.text()); } catch (e) {
      return loadError('damaged', 'That file couldn’t be read. It may be damaged, or it may not be a saved copy from this form.');
    }
    if (!data || data.fileType !== FILE_TYPE) return loadError('wrong_type', 'That isn’t a saved copy from the Gen AI Tool Quality Assurance form.');
    const loaded = migrate(data);
    if (!loaded) return loadError('damaged', 'That saved copy is damaged, so it couldn’t be loaded.');
    const existing = hasTool(state) ? state : (loadSaved() || {}).state;
    if (existing && notDownloaded(existing)) {
      const ok = await ask({
        title: 'Replace the assessment in this browser?',
        body: 'You haven’t saved a copy of the assessment of ' + existing.profile.tool + ' since your last change. Loading this saved copy will replace it.',
        ok: 'Load the copy', cancel: 'Cancel',
      });
      if (!ok) return;
    }
    state = loaded.state;
    persist();
    flash = 'Loaded the assessment of ' + (state.profile.tool || 'the tool') + '. ' + changeText(loaded.notes);
    track('assessment_start', { method: 'load_file' });
    go(validHash(state.lastView) || 'profile');
  }

  async function downloadAssessment() {
    if (!state) return;
    if (!hasTool(state)) {
      await ask({ title: 'Add the tool name first', body: 'The saved copy is named after the tool, so add the ' + T.tool + ' in section 1 first.', ok: 'Go to section 1', cancel: null });
      go('profile');
      return;
    }
    const stamp = new Date().toISOString();
    state.downloaded = stamp > state.updated ? stamp : state.updated;
    state.formVersion = FORM_VERSION;
    state.standardIds = ALL_STANDARDS.map(s => s.id);
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = h('a', { href: url, download: 'Gen AI QA saved copy - ' + fileSafe(state.profile.tool) + ' - ' + todayISO() + '.json' });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    persist();
    track('assessment_download', {});
  }

  function printReport() {
    buildReport();
    window.print();
  }

  // ---------- Routing ----------
  const pageIndex = hv => PAGES.findIndex(p => p.hash === hv);
  const validHash = hv => (pageIndex(hv) >= 0 ? hv : null);
  function currentRoute() {
    const i = pageIndex(location.hash.slice(1));
    if (!state || i < 0) return { view: 'start', index: -1 };
    return { view: PAGES[i].kind, index: i, page: PAGES[i] };
  }
  function go(hv) {
    if (location.hash === '#' + hv) render(); else location.hash = hv;
  }
  function goToStandard(s) {
    pendingFocus = s.id;
    go(areaHash(areaOf(s)));
  }

  // ---------- Rendering ----------
  function renderStatus() {
    const el = $('#save-status');
    if (!el || !state) return;
    const pending = hasTool(state) && notDownloaded(state);
    let text;
    if (!hasTool(state)) text = 'Add the tool name to start';
    else if (!storageOk) text = 'This browser can’t keep your answers: save a copy';
    else text = pending ? 'Changes not saved yet' : 'Saved · up to date';
    if (el.textContent !== text) el.textContent = text;
    $('#btn-download').classList.toggle('attention', pending);
  }

  function renderBar() {
    $('#bar-actions').hidden = !state;
    renderStatus();
  }

  function renderToolLine(route) {
    const el = $('#toolline');
    if (!state || route.view === 'start') { el.hidden = true; return; }
    const p = state.profile;
    const bits = [p.assessedBy.trim() ? 'assessed by ' + p.assessedBy.trim() : '', fmtDate(p.date)].filter(Boolean);
    el.replaceChildren('Assessing ', h('b', null, p.tool.trim() || 'a new tool'), bits.length ? ' · ' + bits.join(' · ') : '');
    el.hidden = false;
  }

  function navCount(p) {
    if (p.kind === 'profile') return hasTool(state) ? '✓' : '';
    if (p.kind === 'area') return doneIn(p.area) + ' of ' + p.area.standards.length;
    if (p.kind === 'risks') { const n = loggedRisks().length; return n ? n + ' logged' : ''; }
    return state.signoff.decision ? '✓' : '';
  }

  function viewNav(route) {
    const total = ALL_STANDARDS.length, done = doneCount();
    const items = [];
    // Set through el.style, not a style attribute: a Content-Security-Policy blocks style attributes.
    const bar = h('span');
    bar.style.width = (total ? Math.round(100 * done / total) : 0) + '%';
    PAGES.forEach((p, i) => {
      if (p.kind === 'area' && PAGES[i - 1].kind !== 'area') items.push(h('li', { class: 'group' }, SECTIONS.checklist.nav));
      items.push(h('li', { class: p.kind === 'area' ? 'sub-item' : null },
        h('a', { href: '#' + p.hash, 'aria-current': route.index === i ? 'page' : null },
          h('span', null, navLabel(p)), h('span', { class: 'count' }, navCount(p)))));
    });
    return h('nav', { class: 'sections', 'aria-label': 'Sections' },
      h('div', { class: 'overall' }, 'Checklist: ' + done + ' of ' + total + ' standards with a status',
        h('div', { class: 'progress', 'aria-hidden': 'true' }, bar)),
      h('ul', null, items));
  }

  function mobileNav(route) {
    const opts = [];
    let group = null;
    PAGES.forEach((p, i) => {
      const count = navCount(p);
      const o = h('option', { value: p.hash, selected: route.index === i }, navLabel(p) + (count && count !== '✓' ? ' (' + count + ')' : ''));
      if (p.kind === 'area') {
        if (!group) { group = h('optgroup', { label: SECTIONS.checklist.nav }); opts.push(group); }
        group.append(o);
      } else {
        opts.push(o);
      }
    });
    const sel = h('select', { id: 'jump', onchange: e => go(e.target.value) }, opts);
    return h('div', { class: 'mobile-nav' }, h('label', { class: 'field-label', for: 'jump' }, 'Go to'), sel);
  }

  function refreshNav() {
    const route = currentRoute();
    const nav = document.querySelector('nav.sections');
    if (nav) nav.replaceWith(viewNav(route));
    const mob = document.querySelector('.mobile-nav');
    if (mob) mob.replaceWith(mobileNav(route));
    const ac = $('#area-count');
    if (ac && route.view === 'area') ac.textContent = areaCount(route.page.area);
  }

  function render() {
    const route = currentRoute();
    if (state && route.view !== 'start') {
      const hv = location.hash.slice(1);
      if (state.lastView !== hv) { state.lastView = hv; if (hasTool(state)) scheduleSave(); }
    }
    renderBar();
    renderToolLine(route);
    const main = $('#main');
    main.replaceChildren();
    if (route.view === 'start') {
      main.append(viewStart());
      document.title = PAGE_NAME;
    } else {
      const content = h('div', { class: 'content' }, mobileNav(route));
      if (flash) { content.append(h('div', { class: 'flash', role: 'status' }, flash)); flash = null; }
      const views = { profile: viewProfile, area: viewArea, risks: viewRisks, signoff: viewSignoff };
      content.append(views[route.view](route.index));
      main.append(h('div', { class: 'layout' }, viewNav(route), content));
      document.title = pageTitle(route.page) + ' · ' + PAGE_NAME;
    }
    if (pendingFocus) {
      const el = document.getElementById('q-' + pendingFocus);
      pendingFocus = null;
      if (el) {
        el.scrollIntoView({ block: 'start' });
        const first = el.querySelector('textarea, input');
        if (first) first.focus({ preventScroll: true });
      }
    } else if (!firstRender) {
      window.scrollTo(0, 0);
      const h1 = main.querySelector('h1');
      if (h1) h1.focus({ preventScroll: true });
    }
    firstRender = false;
  }

  // Form controls. Each calls onInput with the new value, then marks the assessment changed.
  function textInput(id, label, value, onInput, opts) {
    opts = opts || {};
    const input = h('input', {
      type: opts.type || 'text', id, value: value || '', autocomplete: 'off', placeholder: opts.placeholder,
      'aria-describedby': opts.hint ? id + '-hint' : null,
      oninput: e => { onInput(e.target.value); touch(); },
    });
    return h('div', { class: 'field' + (opts.wide ? ' wide' : '') + (opts.extraClass ? ' ' + opts.extraClass : ''), hidden: opts.hidden },
      h('label', { class: 'field-label', for: id }, label),
      opts.hint ? h('p', { class: 'hint', id: id + '-hint' }, opts.hint) : null,
      input, opts.after);
  }
  function textArea(id, label, hint, value, onInput, opts) {
    opts = opts || {};
    return h('div', { class: 'field' + (opts.wide ? ' wide' : '') },
      h('label', { class: 'field-label', for: id }, label),
      hint ? h('p', { class: 'hint', id: id + '-hint' }, hint) : null,
      h('textarea', {
        id, rows: String(opts.rows || 4), value: value || '', placeholder: opts.placeholder,
        'aria-describedby': hint ? id + '-hint' : null,
        oninput: e => { onInput(e.target.value); touch(); },
      }));
  }
  // A tick box that adds or removes value in list (an array held in the state).
  function checkRow(id, labelKids, list, value, after) {
    const input = h('input', {
      type: 'checkbox', id, checked: list.includes(value), onchange: e => {
        const i = list.indexOf(value);
        if (e.target.checked && i < 0) list.push(value);
        if (!e.target.checked && i >= 0) list.splice(i, 1);
        touch();
        if (after) after(e.target.checked);
      },
    });
    return h('label', { class: 'check', for: id }, input, h('span', null, labelKids));
  }

  function nextback(idx, nextEl) {
    const prev = PAGES[idx - 1], next = PAGES[idx + 1];
    return h('div', { class: 'nextback' },
      h('a', { class: 'btn', href: '#' + (prev ? prev.hash : 'start') }, '← ' + (prev ? navLabel(prev) : 'Back to start')),
      nextEl || (next ? h('a', { class: 'btn primary', href: '#' + next.hash }, 'Next: ' + navLabel(next) + ' →') : null));
  }

  function pageHeading(idx, small) {
    return [
      h('h1', { class: 'section-title', tabindex: '-1' }, h('span', null, pageTitle(PAGES[idx])), small || null),
      h('hr', { class: 'rule' }),
    ];
  }

  function viewStart() {
    const existing = hasTool(state) ? state : (loadSaved() || {}).state;
    const actions = h('div', { class: 'hero-actions' });
    if (hasTool(existing)) {
      actions.append(h('button', { type: 'button', class: 'btn-hero primary', onclick: carryOn },
        h('span', null, 'Carry on with ' + existing.profile.tool),
        h('span', { class: 'btn-note' }, 'Kept in this browser · last changed ' + fmtDateTime(existing.updated))));
    }
    actions.append(
      h('button', { type: 'button', class: 'btn-hero' + (hasTool(existing) ? '' : ' primary'), onclick: startNew }, 'Start a new assessment'),
      h('button', { type: 'button', class: 'btn-hero', onclick: chooseFile }, 'Load a saved copy'));
    const step = (title, text) => h('div', null, h('h3', null, title), h('p', null, text));
    return h('div', null,
      h('section', { class: 'hero' },
        h('h1', { tabindex: '-1' }, APP_NAME),
        h('p', null, FORM.tagline),
        actions),
      h('div', { class: 'intro' },
        h('p', { class: 'lead' }, richText(FORM.intro)),
        h('h2', null, 'How it works'),
        h('div', { class: 'steps' },
          step('1. Complete the four sections', 'Tool profile, the ' + ALL_STANDARDS.length + ' DfE standards, the risk assessment and mitigation log, and the approval sign-off.'),
          step('2. Save it to come back later', 'Whenever you stop, save a copy and keep it somewhere safe. Next time, choose Load a saved copy to pick up where you left off, or pass the copy to a colleague. You never need to open it yourself.'),
          step('3. Print the completed form', 'Print it or save it as a PDF, sign it and keep it as evidence of your decision.')),
        h('p', { class: 'browser-note' }, h('strong', null, 'Don’t rely on this browser to keep your work. '),
          'Answers are kept here as you go so a refresh doesn’t lose them, but they can be cleared at any time, for example on a shared computer, in a private window or when browser data is wiped.'),
        SUPPORT_URL || SUPPORT_MAILTO ? [
          h('h2', null, 'Need more help?'),
          h('p', null, 'For more guidance on using AI safely in your school, visit LGfL’s AI support pages or get in touch with our safeguarding team.'),
          h('div', { class: 'support-actions' },
            SUPPORT_URL ? h('a', { class: 'btn primary', href: SUPPORT_URL, target: '_blank', rel: 'noopener noreferrer' }, 'Get More AI Support') : null,
            SUPPORT_MAILTO ? h('a', { class: 'btn', href: SUPPORT_MAILTO }, 'Email ' + SUPPORT_EMAIL) : null),
        ] : null,
        h('h2', null, 'Your privacy'),
        h('p', null, 'Nothing you type into the form is sent anywhere. It stays in this browser and in any copy you save.',
          GA_ID ? ' With your permission, we use Google Analytics to count visits and finished assessments. It never receives your answers or notes.' : ''),
        h('p', { class: 'disclaimer' }, disclaimer(null))));
  }

  function viewProfile(idx) {
    const p = state.profile;
    const toolError = h('p', { class: 'error', id: 'f-tool-error', hidden: true }, 'Enter the ' + T.tool + ' before you continue.');
    const tool = textInput('f-tool', T.tool, p.tool, v => {
      p.tool = v;
      if (v.trim()) {
        toolError.hidden = true;
        $('#f-tool').removeAttribute('aria-invalid');
        $('#f-tool').removeAttribute('aria-describedby');
      }
      renderToolLine(currentRoute());
      refreshNav();
    }, { after: toolError });
    const other = USE_CASES.find(u => u.other);
    const otherField = other ? textInput('f-other', T.otherSpecify, p.otherUse, v => { p.otherUse = v; },
      { extraClass: 'other-field', hidden: !p.useCases.includes(other.id) }) : null;
    const useCases = h('fieldset', { class: 'field wide' },
      h('legend', { class: 'field-label' }, T.useCases, h('span', { class: 'optional' }, ' ' + T.useCasesHint)),
      dfeRef('educational-use-cases'),
      h('div', { class: 'checks' }, USE_CASES.map(u => checkRow('uc-' + u.id, u.label, p.useCases, u.id, on => {
        if (!u.other) return;
        otherField.hidden = !on;

      }))),

    const next = PAGES[idx + 1];
    const cont = h('button', {
      type: 'button', class: 'btn primary', onclick: () => {
        if (!hasTool(state)) {
          const f = $('#f-tool');
          f.setAttribute('aria-invalid', 'true');
          f.setAttribute('aria-describedby', 'f-tool-error');
          toolError.hidden = false;
          f.focus();
          return;
        }
        persist();
        go(next.hash);
      },
    }, 'Next: ' + navLabel(next) + ' →');
    return h('div', null,
      pageHeading(idx),
      h('div', { class: 'details-grid' },
        tool,
        textInput('f-assessed', T.assessedBy, p.assessedBy, v => { p.assessedBy = v; renderToolLine(currentRoute()); }),
        textInput('f-date', T.date, p.date, v => { p.date = v; renderToolLine(currentRoute()); }, { type: 'date' }),
        textArea('f-demo', T.demographic, FORM.demographicHint, p.demographic, v => { p.demographic = v; }, { wide: true, rows: 3 }),
        useCases),
      nextback(idx, cont));
  }

  function markPupilNA(a) {
    let n = 0;
    a.standards.forEach(s => {
      if (!s.pupilsOnly || statusOf(s.id)) return;
      const cur = state.standards[s.id] || { status: '', supplier: '', school: '' };
      cur.status = 'na';
      cur.title = s.num + '. ' + s.title;
      state.standards[s.id] = cur;
      state.newIds = state.newIds.filter(x => x !== s.id);
      n++;
    });
    touch();
    checkCompletion();
    persist();
    flash = plural(n, 'standard', 'standards') + ' marked N/A. You can still change them.';
    render();
  }

  function viewArea(idx) {
    const a = PAGES[idx].area;
    const pupilLabel = String(FORM.pupilsOnlyLabel || '');
    const openPupil = a.standards.some(s => s.pupilsOnly && !statusOf(s.id));
    return h('div', null,
      h('p', { class: 'kicker' }, SECTIONS.checklist.title),
      pageHeading(idx, h('small', { id: 'area-count' }, areaCount(a))),
      h('div', { class: 'section-intro' },
        h('p', null, FORM.checklistIntro),
        openPupil ? h('div', { class: 'na-offer' },
          h('span', null, 'Standards marked “' + pupilLabel.replace(/:\s*$/, '') + '” only apply if pupils use the tool.'),
          h('button', { type: 'button', class: 'btn small', onclick: () => markPupilNA(a) }, 'Pupils won’t use it: mark them N/A')) : null),
      a.standards.map(standardBlock),
      nextback(idx));
  }

  function standardBlock(s) {
    const a = state.standards[s.id] || {};
    const meta = h('p', { class: 'q-meta' });
    if (s.pupilsOnly) meta.append(h('span', { class: 'badge warn' }, FORM.pupilsOnlyLabel));
    if (state.newIds.includes(s.id)) meta.append(h('span', { class: 'badge', 'data-flag': '' }, 'New'));
    const update = patch => {
      const cur = state.standards[s.id] || { status: '', supplier: '', school: '' };
      Object.assign(cur, patch);
      cur.title = s.num + '. ' + s.title;
      state.standards[s.id] = cur;
      if (state.newIds.includes(s.id)) {
        state.newIds = state.newIds.filter(x => x !== s.id);
        meta.querySelectorAll('[data-flag]').forEach(x => x.remove());
      }
    };
    const radios = [];
    const setStatus = v => {
      update({ status: v });
      touch();
      clearBtn.hidden = !v;
      refreshNav();
      checkCompletion();
      persist();
    };
    const clearBtn = h('button', {
      type: 'button', class: 'btn-link', hidden: !a.status,
      onclick: () => { radios.forEach(r => { r.checked = false; }); setStatus(''); radios[0].focus(); },
    }, 'Clear status');
    const options = STATUSES.map(x => {
      const input = h('input', { type: 'radio', name: 'st-' + s.id, value: x.value, checked: a.status === x.value, onchange: () => setStatus(x.value) });
      radios.push(input);
      return h('label', { class: 'opt' }, input, h('span', null, x.label));
    });
    const tid = 't-' + s.id;
    return h('section', { class: 'q', id: 'q-' + s.id, 'aria-labelledby': tid },
      meta.childNodes.length ? meta : null,
      h('h2', { class: 'q-text', id: tid }, s.num + '. ' + s.title),
      h('ul', { class: 'criteria' }, s.criteria.map(c => h('li', null, c))),
      dfeRef(s.dfe),
      h('div', { class: 'qfields' },
        textArea('sup-' + s.id, T.supplier, richText(s.supplier), a.supplier, v => update({ supplier: v })),
        textArea('sch-' + s.id, T.school, richText(s.school), a.school, v => update({ school: v }))),
      h('fieldset', null,
        h('legend', { class: 'field-label' }, T.status, h('span', { class: 'sr-only' }, ' for ' + s.num + '. ' + s.title)),
        h('div', { class: 'resp' }, options),
        h('div', { class: 'clear-row' }, clearBtn)));
  }

  function matrixTable() {
    const L = RISK.likelihood, I = RISK.impact;
    const rows = L.map((_, k) => L.length - 1 - k); // Almost Certain at the top, as in the template
    return h('div', { class: 'table-wrap' }, h('table', { class: 'matrix' },
      h('caption', null, RISK.name),
      h('thead', null, h('tr', null, h('th', { scope: 'col' }, T.likelihood), I.map((n, k) => h('th', { scope: 'col' }, n + ' (' + (k + 1) + ')')))),
      h('tbody', null, rows.map(l => h('tr', null,
        h('th', { scope: 'row' }, L[l] + ' (' + (l + 1) + ')'),
        I.map((_, i) => {
          const band = RISK.bands[l][i];
          return h('td', { class: 'band-' + String(band).toLowerCase() }, band + ' (' + (l + 1) * (i + 1) + ')');
        }))))));
  }

  function exampleCard(ex) {
    return h('div', { class: 'example' },
      h('h3', null, ex.title),
      h('p', null, ex.hazard),
      h('dl', null,
        h('dt', null, T.inherent), h('dd', null, ex.inherent),
        h('dt', null, T.mitigation), h('dd', null, h('ul', null, (ex.mitigation || []).map(m => h('li', null, m)))),
        h('dt', null, T.residual), h('dd', null, ex.residual),
        h('dt', null, T.owner), h('dd', null, ex.owner)));
  }

  function ratingPicker(idBase, label, r, lKey, iKey) {
    const out = h('output', { id: idBase + '-out', 'aria-live': 'polite' });
    const show = () => {
      const text = ratingText(r[lKey], r[iKey]);
      out.textContent = text || 'Not rated yet';
      out.className = 'rating ' + (text ? 'band-' + ratingBand(r[lKey], r[iKey]).toLowerCase() : 'none');
    };
    const pickOne = (key, text, names) => {
      const sid = idBase + '-' + key;
      return h('div', { class: 'field' },
        h('label', { class: 'rating-label', for: sid }, text),
        h('select', { id: sid, onchange: e => { r[key] = +e.target.value; touch(); show(); } },
          h('option', { value: '0' }, 'Choose'),
          names.map((n, k) => h('option', { value: String(k + 1), selected: r[key] === k + 1 }, n + ' (' + (k + 1) + ')'))));
    };
    show();
    return h('fieldset', { class: 'rating-picker' },
      h('legend', { class: 'field-label' }, label),
      h('div', { class: 'rating-row' },
        pickOne(lKey, T.likelihood, RISK.likelihood),
        pickOne(iKey, T.impact, RISK.impact),
        h('div', { class: 'rating-result' }, out)));
  }

  function riskCard(r, i, removeRisk) {
    const id = 'risk-' + r.id;
    return h('section', { class: 'risk', 'aria-labelledby': id + '-t' },
      h('div', { class: 'risk-head' },
        h('h3', { id: id + '-t' }, 'Risk ' + (i + 1)),
        h('button', { type: 'button', class: 'btn-link', onclick: () => removeRisk(r) }, 'Remove', h('span', { class: 'sr-only' }, ' risk ' + (i + 1)))),
      textArea(id + '-hazard', T.hazard, null, r.hazard, v => { r.hazard = v; refreshNav(); }, { rows: 3, placeholder: PLACEHOLDERS.hazard }),
      ratingPicker(id + '-inh', T.inherent, r, 'inherentL', 'inherentI'),
      textArea(id + '-mit', T.mitigation, null, r.mitigation, v => { r.mitigation = v; }, { rows: 4, placeholder: PLACEHOLDERS.mitigation }),
      ratingPicker(id + '-res', T.residual, r, 'residualL', 'residualI'),
      textInput(id + '-owner', T.owner, r.owner, v => { r.owner = v; }, { placeholder: PLACEHOLDERS.owner }));
  }

  function viewRisks(idx) {
    const list = h('div');
    const draw = () => list.replaceChildren(...state.risks.map((r, i) => riskCard(r, i, removeRisk)));
    const addBtn = h('button', {
      type: 'button', class: 'btn', onclick: () => {
        const r = newRisk();
        state.risks.push(r);
        touch();
        draw();
        const f = document.getElementById('risk-' + r.id + '-hazard');
        if (f) f.focus();
      },
    }, '+ Add another risk');
    async function removeRisk(r) {
      if (riskHasContent(r)) {
        const ok = await ask({ title: 'Remove this risk?', body: 'What you’ve written for this risk will be deleted.', ok: 'Remove', cancel: 'Keep it' });
        if (!ok) return;
      }
      state.risks = state.risks.filter(x => x !== r);
      if (!state.risks.length) state.risks.push(newRisk());
      touch();
      draw();
      refreshNav();
      persist();
      addBtn.focus();
    }
    draw();
    const examples = Array.isArray(FORM.riskExamples) ? FORM.riskExamples : [];
    return h('div', null,
      pageHeading(idx),
      h('div', { class: 'section-intro' }, h('p', null, FORM.riskIntro)),
      matrixTable(),
      examples.length ? h('details', { class: 'panel' },
        h('summary', null, 'Show the ' + (examples.length === 2 ? 'two examples' : 'examples')),
        h('div', { class: 'panel-body' }, examples.map(exampleCard))) : null,
      h('h2', { class: 'sub' }, 'Your risks'),
      list,
      h('div', { class: 'add-row' }, addBtn),
      nextback(idx));
  }

  function todoItems() {
    const items = [];
    if (!hasTool(state)) items.push(h('a', { href: '#profile' }, T.tool));
    ALL_STANDARDS.filter(s => !statusOf(s.id)).forEach(s => {
      items.push(h('a', { href: '#' + areaHash(areaOf(s)), onclick: e => { e.preventDefault(); goToStandard(s); } }, T.status + ' for ' + s.num + '. ' + s.title));
    });
    state.risks.forEach((r, i) => {
      if (r.hazard.trim() && (!ratingText(r.inherentL, r.inherentI) || !ratingText(r.residualL, r.residualI))) {
        items.push(h('a', { href: '#risks' }, T.inherent + ' and ' + T.residual.toLowerCase() + ' for risk ' + (i + 1)));
      }
    });
    if (!state.signoff.decision) items.push(T.decision);
    return items.length ? [h('h2', { class: 'sub' }, 'Still to complete'), h('ul', { class: 'plain-list' }, items.map(x => h('li', null, x)))] : [];
  }

  function viewSignoff(idx) {
    const so = state.signoff;
    const todo = h('div');
    const drawTodo = () => todo.replaceChildren(...todoItems());
    const radios = [];
    const setDecision = v => {
      so.decision = v;
      touch();
      clearBtn.hidden = !v;
      if (v) recordDecision();
      refreshNav();
      drawTodo();
      persist();
    };
    const clearBtn = h('button', {
      type: 'button', class: 'btn-link', hidden: !so.decision,
      onclick: () => { radios.forEach(r => { r.checked = false; }); setDecision(''); radios[0].focus(); },
    }, 'Clear decision');
    const decision = h('fieldset', { class: 'field' },
      h('legend', { class: 'field-label' }, T.decision),
      h('div', { class: 'resp two' }, DECISIONS.map(d => {
        const input = h('input', { type: 'radio', name: 'decision', value: d.id, checked: so.decision === d.id, onchange: () => setDecision(d.id) });
        radios.push(input);
        return h('label', { class: 'opt' }, input, h('span', null, d.label));
      })),
      h('div', { class: 'clear-row' }, clearBtn));
    drawTodo();
    return h('div', null,
      pageHeading(idx),
      h('div', { class: 'section-intro' }, h('p', null, FORM.signOffIntro)),
      h('fieldset', { class: 'field' },
        h('legend', { class: 'field-label' }, T.reviewed),
        h('div', { class: 'checks' }, REVIEWERS.map(r => checkRow('rev-' + r.id, r.label, so.reviewers, r.id)))),
      h('p', { class: 'browser-note' }, FORM.disagreeNote),
      h('div', { class: 'checks' }, REGISTERS.map(r => checkRow('reg-' + r.id,
        [h('strong', null, r.label), ': ', h('span', { class: 'quiet' }, r.tick)], so.registers, r.id))),
      h('div', { class: 'approval' },
        h('div', { class: 'details-grid' },
          textInput('f-approver', T.approver, so.approver, v => { so.approver = v; }),
          h('div', { class: 'field' }, h('p', { class: 'field-label' }, T.signature), h('p', { class: 'sig-note' }, 'Sign the printed form.')),
          textInput('f-approval-date', T.approvalDate, so.date, v => { so.date = v; }, { type: 'date' })),
        decision,
        h('div', { class: 'details-grid' },
          textInput('f-who', T.whoCanUse, so.whoCanUse, v => { so.whoCanUse = v; }),
          textInput('f-review', T.reviewDate, so.reviewDate, v => { so.reviewDate = v; }, { type: 'date' }))),
      todo,
      h('h2', { class: 'sub' }, 'Coming back to this later?'),
      h('p', null, 'Save a copy and keep it somewhere safe, such as your school’s shared drive. Next time, open this page and choose Load a saved copy to pick up where you left off. You don’t need to open the copy itself.'),
      h('div', { class: 'keep-actions' },
        h('button', { type: 'button', class: 'btn primary', onclick: downloadAssessment }, 'Save Copy')),
      h('h2', { class: 'sub' }, 'Finished?'),
      h('p', null, 'Print the completed form or save it as a PDF, then sign it and keep it as evidence of your decision.'),
      h('div', { class: 'keep-actions' },
        h('button', { type: 'button', class: 'btn', onclick: printReport }, 'Print / Save as PDF')),
      h('p', { class: 'disclaimer' }, disclaimer(state.profile.tool.trim())),
      nextback(idx));
  }

  // ---------- Printed form ----------
  function reportArea(a) {
    return h('div', null,
      h('h3', null, a.title),
      h('table', { class: 'r-grid r-check' },
        h('thead', null, h('tr', null, [T.standardArea, T.supplier, T.school, T.status].map(t => h('th', { scope: 'col' }, t)))),
        h('tbody', null, a.standards.map(s => {
          const ans = state.standards[s.id] || {};
          return h('tr', null,
            h('td', null,
              s.pupilsOnly ? h('p', { class: 'r-pupil' }, FORM.pupilsOnlyLabel) : null,
              h('p', { class: 'r-qtext' }, s.num + '. ' + s.title),
              h('ul', null, s.criteria.map(c => h('li', null, c)))),
            h('td', null, h('p', { class: 'r-prompt' }, richText(s.supplier)), ans.supplier ? h('p', { class: 'r-note' }, ans.supplier) : null),
            h('td', null, h('p', { class: 'r-prompt' }, richText(s.school)), ans.school ? h('p', { class: 'r-note' }, ans.school) : null),
            h('td', { class: 'r-status' }, STATUSES.map(x => h('div', null, box(ans.status === x.value) + ' ' + x.label))));
        }))));
  }

  function reportRisks() {
    const risks = state.risks.filter(riskHasContent);
    return h('table', { class: 'r-grid r-risks' },
      h('thead', null, h('tr', null, [T.hazard, T.inherent, T.mitigation, T.residual, T.owner].map(t => h('th', { scope: 'col' }, t)))),
      h('tbody', null, risks.length ? risks.map(r => h('tr', null,
        h('td', { class: 'r-note' }, r.hazard),
        h('td', null, ratingText(r.inherentL, r.inherentI)),
        h('td', { class: 'r-note' }, r.mitigation),
        h('td', null, ratingText(r.residualL, r.residualI)),
        h('td', { class: 'r-note' }, r.owner))) : h('tr', null, h('td', { colspan: '5' }, 'No risks logged.'))));
  }

  function reportSignoff() {
    const so = state.signoff;
    const line = (label, value) => h('p', { class: 'r-line' },
      h('strong', null, /\?$/.test(label) ? label + ' ' : label + ': '),
      value ? h('span', { class: 'r-note' }, value) : h('span', { class: 'r-blank' }));
    return [
      h('h2', null, SECTIONS.signoff.title),
      h('p', null, FORM.signOffIntro),
      h('table', { class: 'r-grid r-narrow' },
        h('thead', null, h('tr', null, h('td', null), h('th', { scope: 'col' }, T.reviewed))),
        h('tbody', null, REVIEWERS.map(r => h('tr', null, h('th', { scope: 'row' }, r.label), h('td', null, box(so.reviewers.includes(r.id))))))),
      h('p', null, FORM.disagreeNote),
      h('table', { class: 'r-grid r-narrow' },
        h('tbody', null, REGISTERS.map(r => h('tr', null, h('th', { scope: 'row' }, r.label), h('td', null, r.tick + ' ' + box(so.registers.includes(r.id))))))),
      h('div', { class: 'r-approval' },
        line(T.approver, so.approver),
        line(T.signature, ''),
        line(T.approvalDate, fmtDate(so.date)),
        h('p', { class: 'r-line' }, h('strong', null, T.decision + ':')),
        DECISIONS.map(d => h('p', { class: 'r-line' }, box(so.decision === d.id) + ' ' + d.label)),
        line(T.whoCanUse, so.whoCanUse),
        line(T.reviewDate, fmtDate(so.reviewDate))),
    ];
  }

  function buildReport() {
    const r = $('#report');
    r.replaceChildren();
    if (!state) { r.append(h('p', null, 'No assessment is open. Start or load one, then print.')); return; }
    const p = state.profile;
    const tool = p.tool.trim();
    const row = (k, v) => h('tr', null, h('th', { scope: 'row' }, k), h('td', null, v));
    const removed = removedAnswers(state);
    r.append(h('div', null,
      h('div', { class: 'r-head' }, h('img', { src: LOGO_SRC, alt: 'LGfL', class: 'r-logo' }),
        h('div', null, h('p', { class: 'r-kicker' }, APP_NAME), h('h1', null, tool || 'Untitled tool'))),
      h('p', { class: 'r-intro' }, richText(FORM.intro)),
      h('p', { class: 'r-intro' }, FORM.tagline),
      h('h2', null, SECTIONS.profile.title),
      h('table', { class: 'r-details' }, h('tbody', null,
        row(T.tool, tool),
        row(T.assessedBy, p.assessedBy),
        row(T.date, fmtDate(p.date)),
        row(T.demographic, h('span', { class: 'r-note' }, p.demographic)),
        row(T.useCases, USE_CASES.map(u => h('div', null, box(p.useCases.includes(u.id)) + ' ' + u.label +
          (u.other ? ' (' + T.otherSpecify + ': ' + (p.useCases.includes(u.id) && p.otherUse.trim() ? p.otherUse.trim() : '______') + ')' : '')))))),
      h('section', { class: 'r-section' },
        h('h2', null, SECTIONS.checklist.title),
        h('p', null, FORM.checklistIntro),
        AREAS.map(reportArea)),
      h('section', { class: 'r-section' },
        h('h2', null, SECTIONS.risks.title),
        h('p', null, FORM.riskIntro),
        matrixTable(),
        reportRisks()),
      h('section', { class: 'r-section' }, reportSignoff()),
      removed.length ? h('section', { class: 'r-section' },
        h('h2', null, 'Answers for standards no longer in the checklist'),
        removed.map(a => h('div', { class: 'r-removed' },
          h('p', { class: 'r-qtext' }, a.title || a.id),
          h('p', null, h('strong', null, T.status + ': '), STATUS_LABEL[a.status] || 'None'),
          a.supplier ? h('p', { class: 'r-note' }, h('strong', null, T.supplier + ': '), a.supplier) : null,
          a.school ? h('p', { class: 'r-note' }, h('strong', null, T.school + ': '), a.school) : null))) : null,
      h('p', { class: 'r-disclaimer' }, disclaimer(tool) + ' Printed ' + fmtDateTime(new Date().toISOString()) + '.')));
  }

  function fillFooter() {
    const pilot = $('#pilot');
    if (SETTINGS.pilotNotice) {
      pilot.append(h('mark', null, SETTINGS.pilotNotice));
      if (SETTINGS.feedbackEmail) pilot.append('Feedback welcome: ', h('a', { href: 'mailto:' + SETTINGS.feedbackEmail }, SETTINGS.feedbackEmail));
    } else {
      pilot.hidden = true;
    }
    const meta = $('#foot-meta');
    $('#foot-copy').append('LGfL ' + new Date().getFullYear() + '©');
    const privacy = safeUrl(SETTINGS.privacyNoticeUrl);
    const links = [];
    if (privacy) links.push(h('a', { href: privacy, target: '_blank', rel: 'noopener noreferrer' }, 'Privacy notice'));
    if (SUPPORT_URL) links.push(h('a', { href: SUPPORT_URL, target: '_blank', rel: 'noopener noreferrer' }, 'Get more AI support'));
    if (SUPPORT_MAILTO) links.push(h('a', { href: SUPPORT_MAILTO }, 'Contact us'));
    if (GA_ID) links.push(h('button', { type: 'button', class: 'btn-link', onclick: showBanner }, 'Cookie settings'));
    links.forEach((l, i) => meta.append(i ? ' · ' : '', l));
  }

  function renderProblems(list) {
    $('#main').replaceChildren(h('div', { class: 'intro' },
      h('h1', { class: 'section-title' }, 'The form content needs fixing'),
      h('p', null, 'The form can’t start until these are fixed in the FORM CONTENT at the top of the file:'),
      h('ul', null, list.map(p => h('li', null, p)))));
  }

  // ---------- Start up ----------
  function init() {
    fillFooter();
    const problems = checkForm();
    if (problems.length) { renderProblems(problems); return; }
    if (GA_ID) {
      buildBanner();
      const c = consent();
      if (c === 'granted') loadGA(); else if (!c) showBanner();
    }
    $('#btn-download').addEventListener('click', downloadAssessment);
    $('#btn-print').addEventListener('click', printReport);
    fileInput.addEventListener('change', onFileChosen);
    window.addEventListener('hashchange', render);
    window.addEventListener('beforeprint', () => { buildReport(); if (state) track('report_print', {}); });
    window.addEventListener('pagehide', () => { if (saveTimer) persist(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) persist(); });
    // A refresh or bookmark into the middle of an assessment reopens it without counting a new start.
    if (validHash(location.hash.slice(1))) {
      const saved = loadSaved();
      if (saved) { state = saved.state; flash = changeText(saved.notes) || null; }
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
